repos:
- repo: https://github.com/antonbabenko/pre-commit-terraform
  rev: "v1.109.2"
  hooks:
    - id: terraform_fmt
      args:
      - --args=-recursive
      - --args=-no-color
    - id: terraform_validate
      exclude: ^examples/
    - id: terraform_tflint
      exclude: ^examples/
    - id: terraform_docs
